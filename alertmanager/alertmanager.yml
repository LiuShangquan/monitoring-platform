global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.qq.com:587"
  smtp_from: "l18633130289@qq.com"
  smtp_auth_username: "l18633130289@qq.com"
  smtp_auth_password_file: "/run/secrets/smtp_auth_password"
  smtp_require_tls: true

route:
  group_by: ["alertname", "category", "severity", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  receiver: email-primary
  routes:
    - matchers:
        - severity="critical"
      receiver: email-primary
      repeat_interval: 30m
    - matchers:
        - severity="warning"
      receiver: email-primary
      repeat_interval: 1h

inhibit_rules:
  # When a host is down, suppress lower-level alerts from the same instance.
  - source_matchers:
      - alertname="HostDown"
    target_matchers:
      - severity=~"warning|info"
    equal: ["instance"]

receivers:
  - name: email-primary
    email_configs:
      - to: "l18633130289@qq.com"
        send_resolved: true
        headers:
          subject: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} {{ .CommonLabels.instance }}"

templates: []
