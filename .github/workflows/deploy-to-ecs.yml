name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monitoring-platform
  cancel-in-progress: false

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Validate YAML and JSON
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            require "json"
            Dir.glob("**/*.{yml,yaml}").each { |f| YAML.load_file(f) }
            Dir.glob("**/*.json").each { |f| JSON.parse(File.read(f)) }
            puts "yaml/json ok"
          '

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            first_line="$(head -n 1 "$file")"
            if [ "$first_line" != "#!/bin/bash" ]; then
              echo "$file missing #!/bin/bash"
              exit 1
            fi
            bash -n "$file"
          done < <(find scripts -name "*.sh" -type f | sort)

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package project
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/monitoring-platform.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='backups' \
            --exclude='.chaos' \
            --exclude='monitoring-platform.tar.gz' \
            -czf "$package_path" .
          cp "$package_path" monitoring-platform.tar.gz
          ls -lh monitoring-platform.tar.gz

      - name: Configure SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing GitHub secret ECS_HOST}"
          : "${ECS_SSH_KEY:?Missing GitHub secret ECS_SSH_KEY}"

          ECS_PORT="${ECS_PORT:-22}"

          if ! printf '%s\n' "$ECS_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "ECS_SSH_KEY must be the private key content, not the .pub public key." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key

          if [ -n "${ECS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "ECS_KNOWN_HOSTS is empty, scanning SSH host key from $ECS_HOST:$ECS_PORT"
            timeout 10 ssh-keyscan -p "$ECS_PORT" "$ECS_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Upload package
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing GitHub secret ECS_HOST}"
          : "${ECS_USER:?Missing GitHub secret ECS_USER}"
          ECS_PORT="${ECS_PORT:-22}"
          scp -i ~/.ssh/ecs_deploy_key -P "$ECS_PORT" monitoring-platform.tar.gz \
            "$ECS_USER@$ECS_HOST:/tmp/monitoring-platform-${GITHUB_SHA}.tar.gz"

      - name: Deploy on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          CADVISOR_IMAGE: ${{ secrets.CADVISOR_IMAGE }}
        run: |
          set -euo pipefail
          : "${ECS_HOST:?Missing GitHub secret ECS_HOST}"
          : "${ECS_USER:?Missing GitHub secret ECS_USER}"
          ECS_PORT="${ECS_PORT:-22}"
          ssh -i ~/.ssh/ecs_deploy_key -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" \
            "DEPLOY_DIR='${DEPLOY_DIR:-/opt/monitoring-platform}' PACKAGE='/tmp/monitoring-platform-${GITHUB_SHA}.tar.gz' GITHUB_SHA='${GITHUB_SHA}' GRAFANA_ADMIN_PASSWORD='${GRAFANA_ADMIN_PASSWORD:-}' SERVER_IP='${SERVER_IP:-}' CADVISOR_IMAGE='${CADVISOR_IMAGE:-}' bash -s" <<'REMOTE'
          set -euo pipefail

          RELEASE_DIR="$DEPLOY_DIR/releases/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:-manual}"

          echo "[deploy] Create release directory: $RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          echo "[deploy] Extract package"
          tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

          echo "[deploy] Preserve or create .env"
          if [ -f "$DEPLOY_DIR/current/.env" ]; then
            cp "$DEPLOY_DIR/current/.env" "$RELEASE_DIR/.env"
          elif [ -f "$DEPLOY_DIR/.env" ]; then
            cp "$DEPLOY_DIR/.env" "$RELEASE_DIR/.env"
          else
            cp "$RELEASE_DIR/.env.example" "$RELEASE_DIR/.env"
          fi

          escape_sed_replacement() {
            printf '%s' "$1" | sed -e 's/[\/&|\\]/\\&/g'
          }

          if [ -n "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
            escaped_password="$(escape_sed_replacement "$GRAFANA_ADMIN_PASSWORD")"
            if grep -q '^GF_SECURITY_ADMIN_PASSWORD=' "$RELEASE_DIR/.env"; then
              sed -i "s|^GF_SECURITY_ADMIN_PASSWORD=.*|GF_SECURITY_ADMIN_PASSWORD=$escaped_password|" "$RELEASE_DIR/.env"
            else
              printf '\nGF_SECURITY_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD" >> "$RELEASE_DIR/.env"
            fi
          fi

          if [ -n "${SERVER_IP:-}" ]; then
            escaped_server_ip="$(escape_sed_replacement "$SERVER_IP")"
            if grep -q '^SERVER_IP=' "$RELEASE_DIR/.env"; then
              sed -i "s|^SERVER_IP=.*|SERVER_IP=$escaped_server_ip|" "$RELEASE_DIR/.env"
            else
              printf '\nSERVER_IP=%s\n' "$SERVER_IP" >> "$RELEASE_DIR/.env"
            fi
          fi

          if [ -n "${CADVISOR_IMAGE:-}" ]; then
            escaped_cadvisor_image="$(escape_sed_replacement "$CADVISOR_IMAGE")"
            if grep -q '^CADVISOR_IMAGE=' "$RELEASE_DIR/.env"; then
              sed -i "s|^CADVISOR_IMAGE=.*|CADVISOR_IMAGE=$escaped_cadvisor_image|" "$RELEASE_DIR/.env"
            else
              printf '\nCADVISOR_IMAGE=%s\n' "$CADVISOR_IMAGE" >> "$RELEASE_DIR/.env"
            fi
          fi

          echo "[deploy] Switch current symlink"
          mkdir -p "$DEPLOY_DIR"
          if [ -L "$DEPLOY_DIR/current" ] || [ -f "$DEPLOY_DIR/current" ]; then
            rm -f "$DEPLOY_DIR/current"
          elif [ -d "$DEPLOY_DIR/current" ]; then
            mv "$DEPLOY_DIR/current" "$DEPLOY_DIR/current.bak.$(date +%Y%m%d-%H%M%S)"
          fi
          ln -sfnT "$RELEASE_DIR" "$DEPLOY_DIR/current"
          cd "$DEPLOY_DIR/current"

          echo "[deploy] Ensure scripts executable"
          chmod +x scripts/*.sh scripts/chaos/*.sh

          echo "[deploy] Validate compose"
          docker compose config -q

          echo "[deploy] Pull images"
          docker compose pull

          echo "[deploy] Start stack"
          docker compose up -d

          echo "[deploy] Show status"
          docker compose ps

          echo "[deploy] Run runtime check"
          scripts/check.sh || true
          REMOTE
