global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ecs
    platform: monitoring-platform

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self monitoring.
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Alertmanager health metrics.
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # Linux host metrics. Add more ECS node-exporter targets here when using a central Prometheus.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          role: local-linux-host

  # Docker container metrics from cAdvisor.
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          role: docker-runtime

  # HTTP availability probing through Blackbox Exporter.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://nginx-demo:80
        labels:
          service: nginx-demo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP probe example. Uncomment and adjust targets if needed.
  # - job_name: blackbox-tcp
  #   metrics_path: /probe
  #   params:
  #     module:
  #       - tcp_connect
  #   static_configs:
  #     - targets:
  #         - YOUR_SERVER_IP:22
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox-exporter:9115

